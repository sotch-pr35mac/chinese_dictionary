[package]
name = "chinese_dictionary"
version = "4.0.0"
authors = ["Preston Wang-Stosur-Bassett <p.wanstobas@gmail.com>"]
description = "A searchable Chinese / English dictionary with helpful utilities."
repository = "https://github.com/sotch-pr35mac/chinese_dictionary"
readme = "README.md"
keywords = ["chinese", "dictionary", "hanzi", "cc-cedict", "convert"]
categories = ["internationalization", "localization", "parser-implementations", "text-processing", "value-formatting"]
license = "MIT"
edition = "2021"
rust-version = "1.85"
build = "build.rs"
exclude = ["CHANGELOG.md", "LICENSE-CC-CEDICT.rtf", "target"]

[dependencies]
character_converter = "2.1.4"
chinese_detection = "2.0.3"
fst = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
once_cell = "1.13.0"
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "aligned", "pointer_width_32"] }
sha2 = "0.10.9"
unicode-normalization = "0.1.25"

[build-dependencies]
fst = "0.4"
rkyv = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "aligned", "pointer_width_32"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
zstd = "0.13.3"

[dev-dependencies]
serde_json = "1.0.151"
